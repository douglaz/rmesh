[workspace]
members = ["rmesh-test",
    "rmesh",
    "rmesh-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rmesh Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rmesh"

[workspace.dependencies]
# Core dependencies
meshtastic = { git = "https://github.com/douglaz/meshtastic-rust.git", rev = "a78a028682d98e95540a44f3951b6478fa90fdc7", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
log = "0.4"

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env", "cargo", "color"] }
colored = "2.1"
indicatif = "0.18"
comfy-table = "7.1"

# Utilities
humantime = "2.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
# PSKs are exchanged as base64 (that is what --export-config and channel URLs carry).
# Hand-decoding an encryption key is not worth saving a dependency over.
base64 = "0.22"
strum = { version = "0.28", features = ["derive"] }
